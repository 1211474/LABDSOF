spring:
  application:
    name: support-assistant-service

server:
  port: ${SERVER_PORT:8081}

care-platform:
  base-url: ${CARE_PLATFORM_BASE_URL:http://localhost:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
