spring:
  application:
    name: care-platform-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/careplatform}
    username: ${SPRING_DATASOURCE_USERNAME:careplatform}
    password: ${SPRING_DATASOURCE_PASSWORD:careplatform}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
