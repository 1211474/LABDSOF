global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: care-platform-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["care-platform-api:9090"]

  - job_name: support-assistant-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["support-assistant-service:9091"]
