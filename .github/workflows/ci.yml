name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  care-platform-api:
    name: Care Platform API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        working-directory: care-platform-api
        run: mvn -B verify

  support-assistant-service:
    name: Support Assistant Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        working-directory: support-assistant-service
        run: mvn -B verify

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build

  smoke-test:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs:
      - care-platform-api
      - support-assistant-service
      - frontend
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Verify the end-to-end slice
        run: |
          curl -fsS http://localhost:8080/actuator/health
          curl -fsS "http://localhost:8080/api/v1/services?type=PHARMACY&coarseLocation=Boavista" -o /tmp/services.json
          grep -q "PHARMACY" /tmp/services.json
          curl -fsS -X POST http://localhost:8081/api/v1/ai/navigate \
            -H "Content-Type: application/json" \
            -d '{"query":"pharmacies near Boavista"}' \
            -o /tmp/ai.json
          grep -q "PHARMACY" /tmp/ai.json
          curl -fsS http://localhost:3000/ -o /tmp/index.html
          grep -q "Rede de Apoio a Cuidadores Informais" /tmp/index.html
          curl -fsS "http://localhost:3000/api/v1/services?type=PHARMACY&coarseLocation=Boavista" -o /tmp/proxied-services.json
          grep -q "PHARMACY" /tmp/proxied-services.json
          curl -fsS -X POST http://localhost:3000/api/v1/ai/navigate \
            -H "Content-Type: application/json" \
            -d '{"query":"pharmacies near Boavista"}' \
            -o /tmp/proxied-ai.json
          grep -q "PHARMACY" /tmp/proxied-ai.json
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v
