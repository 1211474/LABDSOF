name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test both modules
        run: |
          mkdir -p ~/.m2/repository
          find ~/.m2/repository -name '*.lastUpdated' -delete
          for module in care-platform-api support-assistant-service; do
            for attempt in 1 2 3; do
              if mvn -B -U -f "$module/pom.xml" verify; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                exit 1
              fi
              echo "Maven failed for $module (attempt $attempt); retrying..."
              sleep 20
            done
          done

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build

  smoke-test:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Verify the end-to-end slice
        run: |
          curl -fsS http://localhost:9090/actuator/health/readiness | jq -e '.status == "UP"'
          curl -fsS http://localhost:9091/actuator/health/readiness | jq -e '.status == "UP"'
          if curl -fsS http://localhost:8080/actuator/prometheus >/dev/null 2>&1; then
            echo "Care Platform metrics must not be exposed on the public API port"
            exit 1
          fi
          if curl -fsS http://localhost:8081/actuator/prometheus >/dev/null 2>&1; then
            echo "Support Assistant metrics must not be exposed on the public API port"
            exit 1
          fi
          for attempt in $(seq 1 12); do
            if curl -fsS http://localhost:9092/api/v1/targets \
              | jq -e '[.data.activeTargets[] | select(.health == "up")] | length == 2' >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "Prometheus did not scrape both backend services"
              exit 1
            fi
            sleep 5
          done
          docker compose logs --no-color --no-log-prefix care-platform-api \
            | jq -e -s -R 'split("\n") | map(select(length > 0) | fromjson) | length > 0 and all(.[]; .service == "care-platform-api" and has("level") and has("message"))' \
            >/dev/null
          docker compose logs --no-color --no-log-prefix support-assistant-service \
            | jq -e -s -R 'split("\n") | map(select(length > 0) | fromjson) | length > 0 and all(.[]; .service == "support-assistant-service" and has("level") and has("message"))' \
            >/dev/null
          curl -fsS "http://localhost:8080/api/v1/services?type=PHARMACY&coarseLocation=Boavista" -o /tmp/services.json
          grep -q "PHARMACY" /tmp/services.json
          curl -fsS -X POST http://localhost:8081/api/v1/ai/navigate \
            -H "Content-Type: application/json" \
            -d '{"query":"pharmacies near Boavista"}' \
            -o /tmp/ai.json
          grep -q "PHARMACY" /tmp/ai.json
          curl -fsS http://localhost:9090/actuator/prometheus | grep -q '^http_server_requests_seconds_count'
          curl -fsS http://localhost:9091/actuator/prometheus | grep -q '^http_server_requests_seconds_count'
          curl -fsS http://localhost:3000/ -o /tmp/index.html
          grep -q "Rede de Apoio a Cuidadores Informais" /tmp/index.html
          curl -fsS "http://localhost:3000/api/v1/services?type=PHARMACY&coarseLocation=Boavista" -o /tmp/proxied-services.json
          grep -q "PHARMACY" /tmp/proxied-services.json
          curl -fsS -X POST http://localhost:3000/api/v1/ai/navigate \
            -H "Content-Type: application/json" \
            -d '{"query":"pharmacies near Boavista"}' \
            -o /tmp/proxied-ai.json
          grep -q "PHARMACY" /tmp/proxied-ai.json
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v
