name: caregiver-support

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-careplatform}
      POSTGRES_USER: ${POSTGRES_USER:-careplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careplatform}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  care-platform-api:
    build: ./care-platform-api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-careplatform}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-careplatform}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-careplatform}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  support-assistant-service:
    build: ./support-assistant-service
    environment:
      CARE_PLATFORM_BASE_URL: http://care-platform-api:8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      LLM_ENABLED: ${LLM_ENABLED:-true}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://generativelanguage.googleapis.com}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.6-flash}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-5000}
    ports:
      - "8081:8081"
    depends_on:
      care-platform-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      care-platform-api:
        condition: service_healthy
      support-assistant-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  postgres-data:
